# 宏观经济板块清单（macro_sync 同步数据 + macro_view 生成判断快照）
# indicators.code 对应 AkshareProvider._MACRO_EXTRACTORS 的键
# threshold_high/low + direction 控制前端状态徽章（如 PMI≥50 绿、CPI>3 偏热）
macro_universe:
  snapshot_horizon_days: 63      # 验证窗口 ≈ 1 季度交易日
  # 宏观经济指标（第一层·宏观状态判断的输入与验证标尺）
  # explanation：详细含义（tip 弹层）；doc_url：外链百科/资料；source/source_url：数据溯源
  indicators:
    - code: "cn_pmi"
      name: "制造业PMI"
      unit: ""
      freq: "month"
      category: "cn"
      group: "growth"
      provider: "akshare"
      threshold_high: 50.0
      threshold_low: 50.0
      direction: "high_good"
      description: "荣枯线50，扩张/收缩分界"
      explanation: "采购经理指数（PMI）。通过对企业采购经理的月度调查汇总，>50 代表制造业环比扩张、<50 代表收缩。是经济增长最敏感的先行指标，拐点（连续数月回升/跌破50）比单月绝对值更重要。"
      doc_url: "https://zh.wikipedia.org/wiki/%E9%87%87%E8%B4%AD%E7%BB%8F%E7%90%86%E6%8C%87%E6%95%B0"
      range_low: 40.0
      range_high: 55.0
      reference_lines:
        - { value: 50.0, label: "荣枯线", severity: "normal" }
      source: "国家统计局"
      source_url: "https://www.stats.gov.cn/sj/zxfb/"
    - code: "cn_cpi_yoy"
      name: "CPI同比"
      unit: "%"
      freq: "month"
      category: "cn"
      group: "inflation"
      provider: "akshare"
      threshold_high: 3.0
      direction: "low_good"
      description: "通胀温度计"
      explanation: "居民消费价格指数同比涨幅，衡量居民端通胀水平。>3% 通常视为通胀偏高、央行可能收紧；持续 <0 为通缩。看趋势比看单月更重要。"
      doc_url: "https://zh.wikipedia.org/wiki/%E6%B6%88%E8%B4%B9%E8%80%85%E7%89%A9%E4%BB%B7%E6%8C%87%E6%95%B0"
      range_low: -2.0
      range_high: 8.0
      reference_lines:
        - { value: 0.0, label: "通缩警戒", severity: "warning" }
        - { value: 3.0, label: "通胀警戒", severity: "warning" }
        - { value: 5.0, label: "严重通胀", severity: "danger" }
      source: "国家统计局"
      source_url: "https://www.stats.gov.cn/sj/zxfb/"
    - code: "cn_ppi_yoy"
      name: "PPI同比"
      unit: "%"
      freq: "month"
      category: "cn"
      group: "inflation"
      provider: "akshare"
      direction: "neutral"
      description: "工业品出厂价格，看利润与通缩"
      explanation: "工业生产者出厂价格指数同比，衡量工业品出厂端价格变化。PPI 领先 CPI（上游传导下游），PPI-CPI 剪刀差反映利润在上下游间的分配。持续负值为工业通缩。"
      doc_url: "https://zh.wikipedia.org/wiki/%E7%94%9F%E4%BA%A7%E8%80%85%E7%89%A9%E4%BB%B7%E6%8C%87%E6%95%B0"
      range_low: -8.0
      range_high: 12.0
      reference_lines:
        - { value: 0.0, label: "通缩/通胀分界", severity: "normal" }
      source: "国家统计局"
      source_url: "https://www.stats.gov.cn/sj/zxfb/"
    - code: "cn_m2_yoy"
      name: "M2同比"
      unit: "%"
      freq: "month"
      category: "cn"
      group: "monetary"
      provider: "akshare"
      direction: "neutral"
      description: "货币供应，流动性松紧"
      explanation: "广义货币供应量（M2）同比增速，反映全社会货币与信贷的松紧。按货币主义框架，M2 领先通胀约 12-18 个月——M2 放量往往预示未来通胀上行。"
      doc_url: "https://zh.wikipedia.org/wiki/%E5%BB%A3%E7%BE%A9%E8%B2%A8%E5%B9%A3"
      range_low: 6.0
      range_high: 16.0
      reference_lines:
        - { value: 8.0, label: "中性", severity: "normal" }
        - { value: 12.0, label: "偏松", severity: "boom" }
      source: "中国人民银行"
      source_url: "https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html"
    - code: "cn_sf"
      name: "社融增量"
      unit: "亿元"
      freq: "month"
      category: "cn"
      group: "monetary"
      provider: "akshare"
      direction: "high_good"
      description: "信用脉冲，领先增长"
      explanation: "社会融资规模增量，实体经济从金融体系获得的资金总额。是信用脉冲的核心指标，领先经济增长约 1-2 个季度——社融放量往往预示后续经济回暖。注：央行 2015 年起按月发布此指标，此前无统计，长周期信用分析请用 M2 同比（1996 起）。"
      doc_url: "https://zh.wikipedia.org/wiki/%E7%A4%BE%E4%BC%9A%E8%9E%8D%E8%B5%84%E8%A7%84%E6%A8%A1"
      source: "中国人民银行"
      source_url: "https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html"
    - code: "cn_lpr_1y"
      name: "1年期LPR"
      unit: "%"
      freq: "day"
      category: "cn"
      group: "monetary"
      provider: "akshare"
      direction: "low_good"
      description: "贷款基准利率，降息信号"
      explanation: "贷款市场报价利率（1年期），银行对最优质客户的贷款利率基准。下调 = 降息（宽松），利好估值；持平 = 利率按兵不动。每月20日公布。"
      doc_url: "https://zh.wikipedia.org/wiki/%E8%B4%B7%E6%AC%BE%E5%B8%82%E5%9C%BA%E6%8A%A5%E4%BB%B7%E5%88%A9%E7%8E%87"
      range_low: 2.5
      range_high: 5.0
      reference_lines:
        - { value: 3.85, label: "长期均值", severity: "normal" }
      source: "全国银行间同业拆借中心"
      source_url: "https://www.chinamoney.com.cn/chinese/bklpr/"
    - code: "cn_m1_yoy"
      name: "M1同比"
      unit: "%"
      freq: "month"
      category: "cn"
      group: "monetary"
      provider: "akshare"
      direction: "neutral"
      description: "狭义货币供应，企业活期资金松紧"
      explanation: "狭义货币供应量（M1）同比增速，主要由企业活期存款构成。M1 反映企业资金活跃度与即时支付能力，M1-M2 剪刀差为负常预示企业投资意愿偏弱。"
      doc_url: "https://zh.wikipedia.org/wiki/%E8%B2%A8%E5%B9%A3%E4%BE%9B%E6%87%89%E9%87%8F"
      range_low: 0.0
      range_high: 20.0
      reference_lines:
        - { value: 5.0, label: "低位", severity: "warning" }
      source: "中国人民银行"
      source_url: "https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html"
    - code: "cn_retail_yoy"
      name: "社零同比"
      unit: "%"
      freq: "month"
      category: "cn"
      group: "growth"
      provider: "akshare"
      direction: "high_good"
      description: "消费景气，内需温度计"
      explanation: "社会消费品零售总额同比增速，衡量居民消费景气度。是内需的核心指标，与居民收入、消费信心直接相关。"
      doc_url: "https://zh.wikipedia.org/wiki/%E7%A4%BE%E4%BC%9A%E6%B6%88%E8%B4%B9%E5%93%81%E9%9B%B6%E5%94%AE%E6%80%BB%E9%A2%9D"
      source: "国家统计局"
      source_url: "https://www.stats.gov.cn/sj/zxfb/"
    - code: "cn_house_sales_amt"
      name: "商品房销售额"
      unit: "亿元"
      freq: "month"
      category: "cn"
      group: "realestate"
      provider: "akshare"
