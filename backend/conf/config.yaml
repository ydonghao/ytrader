      doc_url: "https://zh.wikipedia.org/wiki/%E6%88%BF%E5%9C%B0%E4%BA%A7"
      source: "国家统计局"
      source_url: "https://www.stats.gov.cn/sj/zxfb/"
    - code: "cn_house_sales_area"
