# 国家队主体名单 + 监控 ETF
# 主体用前缀匹配(资管计划/社保组合后缀多变)
# holder_categories: 键 = category 标识; 值 = 前缀列表
holder_categories:
  huijin:
    - 中央汇金投资有限责任公司
    - 中央汇金资产管理有限责任公司
  zhengjin:
    - 中国证券金融股份有限公司
    - 中证金融资产管理计划
  safe:
    - 梧桐树投资平台有限责任公司
    - 北京凤山投资有限责任公司
    - 北京坤藤投资有限责任公司
  social_security:
    - 全国社保基金
    - 全国社会保障基金理事会
    - 社保基金
  # 新增两类(纯增量,向后兼容;前十大流通股东里按名匹配)
  pension:
    - 基本养老保险基金
  big_fund:
    - 国家集成电路产业投资基金

# 6 大国家队主体展示元数据(供"团队"页卡片 + 配色/标签统一)
# key 与 holder_categories 对齐;display = 前端展示名;color/type/desc 来自原仪表盘
entity_meta:
  huijin:
    display: "中央汇金"
    color: "#ef4444"
    type: "汇金系"
    desc: "中国投资有限责任公司全资子公司,代表国家行使国有金融资产出资人权利"
  zhengjin:
    display: "证金公司"
    color: "#00d4ff"
    type: "证金系"
    desc: "经国务院批准设立的全国性证券类金融机构,承担维护市场稳定职能"
  social_security:
    display: "社保基金"
    color: "#22c55e"
    type: "社保系"
    desc: "国家战略储备基金,负责管理运营全国社会保障基金"
  pension:
    display: "养老金"
    color: "#f59e0b"
    type: "养老金系"
    desc: "各省市基本养老保险基金委托全国社保基金理事会投资运营"
  safe:
    display: "外管局"
    color: "#8b5cf6"
    type: "外管局系"
    desc: "国家外汇管理局旗下投资平台,代表外储进行境内股权投资"
  big_fund:
    display: "国家大基金"
    color: "#14b8a6"
    type: "大基金系"
    desc: "国家集成电路产业投资基金,推动半导体产业自主可控"

