<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价值投资与中国</title>
<style>
/* 阅读型排版 - 股票投资学习系列共享样式 */
:root{
  --bg:#faf8f5; --paper:#ffffff; --ink:#2c2c2c; --ink-soft:#5a5a5a;
  --accent:#8b3a3a; --accent-soft:#b56b5a; --rule:#e6dfd6; --highlight:#f3ece0;
  --maxw:720px;
}
*{box-sizing:border-box;}
html{ -webkit-font-smoothing:antialiased; }
body{
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;
  font-size:18px; line-height:1.85; letter-spacing:.01em;
}
.wrap{ max-width:var(--maxw); margin:0 auto; padding:48px 28px 120px; }
header.masthead{ text-align:center; padding:32px 0 40px; border-bottom:1px solid var(--rule); margin-bottom:48px;}
.kicker{ display:inline-block; font-family:"PingFang SC","Helvetica Neue",sans-serif; font-size:13px; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; margin-bottom:14px; }
h1.title{ font-family:"Source Han Serif SC","Noto Serif CJK SC",serif; font-size:34px; line-height:1.35; margin:0 0 18px; font-weight:700; letter-spacing:.02em; }
.meta{ font-family:"PingFang SC","Helvetica Neue",sans-serif; font-size:13px; color:var(--ink-soft); }
.meta span+span::before{ content:" · "; color:var(--rule); }
h2{ font-family:"Source Han Serif SC","Noto Serif CJK SC",serif; font-size:22px; margin:56px 0 18px; padding-left:14px; border-left:4px solid var(--accent); font-weight:700; line-height:1.4; }
h3{ font-family:"PingFang SC","Helvetica Neue",sans-serif; font-size:17px; color:var(--accent); margin:34px 0 12px; font-weight:600; letter-spacing:.04em;}
p{ margin:0 0 20px; text-align:justify; }
p.lead{ font-size:19px; color:var(--ink); }
blockquote{ margin:24px 0; padding:18px 22px; background:var(--highlight); border-left:3px solid var(--accent-soft); color:#4a4035; border-radius:0 6px 6px 0; }
blockquote p{ margin:0; }
.pull{ font-size:21px; text-align:center; color:var(--accent); margin:36px 0; font-weight:600; line-height:1.6; padding:0 8px; }
ul,ol{ margin:0 0 22px; padding-left:1.6em; }
li{ margin:0 0 8px; }
strong{ color:var(--accent); font-weight:700; }
em{ font-style:normal; background:linear-gradient(transparent 62%, #ffe9b3 62%); padding:0 2px; }
.num{ font-family:"PingFang SC","Helvetica Neue",sans-serif; font-variant-numeric:tabular-nums; }
.toc{ background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:20px 24px; margin:0 0 48px; }
.toc h4{ margin:0 0 12px; font-family:"PingFang SC",sans-serif; font-size:14px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase;}
.toc ol{ margin:0; padding-left:1.3em; columns:2; column-gap:32px; }
.toc li{ font-family:"PingFang SC",sans-serif; font-size:14px; color:var(--ink-soft); margin-bottom:6px; break-inside:avoid; }
.toc a{ color:var(--ink-soft); text-decoration:none; }
.toc a:hover{ color:var(--accent); }
footer.colophon{ margin-top:64px; padding-top:24px; border-top:1px solid var(--rule); font-family:"PingFang SC",sans-serif; font-size:12px; color:var(--ink-soft); text-align:center; }
table{ width:100%; border-collapse:collapse; margin:22px 0; font-family:"PingFang SC",sans-serif; font-size:15px; }
th,td{ border:1px solid var(--rule); padding:8px 12px; text-align:left; }
th{ background:var(--highlight); color:var(--accent); font-weight:600; }
@media (max-width:520px){
  .wrap{ padding:28px 18px 80px; } h1.title{ font-size:26px; }
  .toc ol{ columns:1; } h2{ font-size:20px; } body{ font-size:17px; }
}
</style>
<style>figure{margin:32px 0;text-align:center;}figure img{max-width:100%;height:auto;border:1px solid #e6dfd6;border-radius:4px;}figcaption{font-family:"PingFang SC",sans-serif;font-size:14px;color:#5a5a5a;margin-top:10px;line-height:1.6;}figcaption span{color:#8a8a8a;font-size:13px;}</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="kicker">下篇 · 价值投资与理性思考</div>
  <h1 class="title">价值投资与中国</h1>
  <div class="meta"><span>李录 · 文明、现代化、价值投资与中国</span></div>
</header>

<div class="pull">价值投资与中国</div>

<footer class="colophon">
  本文档由 epub 版本整理 · 内容忠于原文，仅作排版优化<br>
  《文明、现代化、价值投资与中国》 · 李录 著 · 中信出版集团
</footer>

</div>
</body>
</html>
